name: cutover

# D8-05 전환일 demo 삭제 — Cloud Run Job plant8-<env>-cutover(08-02 CLI dist/cli/cutover-cli.mjs)를
# dry-run(건수 · 확인 문자열만) 또는 apply(업무 기록 표 · 번호 카운터를 한 트랜잭션으로 비움)로 실행하고
# 결과를 실행 요약에 남긴다. 배포(deploy.sh)는 Job을 만들기만 한다. 절차는 docs/CUTOVER.md §3.
# main·production 확인 입력 검사는 실수 방지 장치이고 권한 경계가 아니다: WIF는 저장소로만
# 묶여 있어 실제 경계는 1인 소유 비공개 저장소의 write 권한이다(T-08-04-05 — restore-rehearsal.yml과
# 같은 수용). GitHub Environments 미사용(D-05).
on:
  workflow_dispatch:
    inputs:
      env:
        type: choice
        description: "대상 환경"
        required: true
        options:
          - staging
          - production
        default: staging
      mode:
        type: choice
        description: "dry-run(건수 · 확인 문자열만) 또는 apply(업무 기록 삭제 — 되돌릴 수 없음)"
        required: true
        options:
          - dry-run
          - apply
        default: dry-run
      confirm:
        type: string
        description: "apply일 때만 — 같은 환경 dry-run 요약의 확인 문자열(N-xxxxxxxx)을 그대로"
        default: ""
      confirm_production:
        type: string
        description: "production일 때만 plant8-prod-db를 그대로 입력"
        default: ""

permissions:
  contents: read
  id-token: write

# deploy.yml과 같은 그룹 — 삭제 중에 배포 · 마이그레이션(스키마 변경)이 겹치지 않게 한다.
# 그룹마다 대기 실행은 하나뿐이라(새 대기가 옛 대기를 취소) 전환일 머지 동결(CUTOVER §3)이 전제다.
concurrency:
  group: deploy
  cancel-in-progress: false

jobs:
  cutover:
    runs-on: ubuntu-latest
    # Job --task-timeout 15분 + 로그 대기(12회 × 10초) · 준비
    timeout-minutes: 30
    steps:
      - id: input-guard
        shell: bash
        env:
          REF: ${{ github.ref }}
          INPUT_ENV: ${{ inputs.env }}
          INPUT_MODE: ${{ inputs.mode }}
          CONFIRM: ${{ inputs.confirm }}
          CONFIRM_PRODUCTION: ${{ inputs.confirm_production }}
        run: |
          LC_ALL=C
          if [ "$REF" != "refs/heads/main" ]; then
            echo "::error::main에서만 돕니다 — main에서 다시 실행하세요" >&2
            exit 1
          fi
          case "$INPUT_ENV" in
            staging | production) ;;
            *)
              echo "::error::env는 staging 또는 production만 됩니다" >&2
              exit 1
              ;;
          esac
          case "$INPUT_MODE" in
            dry-run | apply) ;;
            *)
              echo "::error::mode는 dry-run 또는 apply만 됩니다" >&2
              exit 1
              ;;
          esac
          if [ "$INPUT_ENV" = "production" ] && [ "$CONFIRM_PRODUCTION" != "plant8-prod-db" ]; then
            echo "::error::production은 confirm_production에 plant8-prod-db를 그대로 적어야 돕니다" >&2
            exit 1
          fi
          if [ "$INPUT_MODE" = "apply" ]; then
            if ! [[ "$CONFIRM" =~ ^[0-9]+-[0-9a-f]{8}$ ]]; then
              echo "::error::apply는 confirm에 같은 환경 dry-run 요약의 확인 문자열(N-xxxxxxxx)을 그대로 적어야 돕니다" >&2
              exit 1
            fi
          elif [ -n "$CONFIRM" ]; then
            echo "::error::dry-run에는 confirm을 비워 두세요 — apply하려면 mode를 apply로 고르세요" >&2
            exit 1
          fi
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - id: auth
        uses: google-github-actions/auth@7c6bc770dae815cd3e89ee6cdf493a5fab2cc093 # v3.0.0
        with:
          workload_identity_provider: projects/${{ vars.GCP_PROJECT_NUMBER }}/locations/global/workloadIdentityPools/github/providers/erp-repo
          service_account: gha-deployer@${{ vars.GCP_PROJECT_ID }}.iam.gserviceaccount.com
      - uses: google-github-actions/setup-gcloud@aa5489c8933f4cc7a4f7d45035b3b1440c9c10db # v3.0.1
      - id: run
        shell: bash
        env:
          INPUT_ENV: ${{ inputs.env }}
          INPUT_MODE: ${{ inputs.mode }}
          CONFIRM: ${{ inputs.confirm }}
          PROJECT: ${{ vars.GCP_PROJECT_ID }}
          REGION: ${{ vars.GCP_REGION }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          source infra/names.sh
          ENV_SHORT="$INPUT_ENV"
          if [ "$ENV_SHORT" = "production" ]; then
            ENV_SHORT="prod"
          fi
          JOB="$(job_name "$ENV_SHORT" cutover)"
          ATTEMPTS=12
          INTERVAL=10

          # 요약 쓰기는 전부 tee -a — 같은 줄이 실행 로그(표준 출력)에도 남아 `gh run view --log`로 대조한다(08-07 · 08-08).
          say() {
            printf '%s\n\n' "$*" | tee -a "$GITHUB_STEP_SUMMARY"
          }
          seoul() {
            TZ=Asia/Seoul date -d "$1" '+%Y-%m-%d %H:%M' 2>/dev/null || printf '%s' "$1"
          }

          # CLI(lib/log)는 한 줄 JSON을 쓰고 Cloud Logging은 그것을 jsonPayload로 파싱한다 — textPayload가 아니다.
          # LOGS = gcloud `json(jsonPayload)` 출력(최신 먼저 · 키 정렬 · 2칸 들여쓰기). jq 없이 그 꼴을 awk로 읽는다.
          # entry: 이벤트가 정확히 같은(닫는 따옴표까지 — cutover.objects ≠ cutover.objects.pending) 항목 블록을 그대로 찍는다.
          # awk는 끝까지 읽는다(중간 exit는 pipefail에서 printf를 SIGPIPE로 죽인다).
          entry() {
            printf '%s\n' "$LOGS" | awk -v ev="$1" '
              /^  \{$/ { n = 0; hit = 0; next }
              /^  \},?$/ { if (hit && !shown) { print "{"; for (i = 1; i <= n; i++) print buf[i]; print "}"; shown = 1 } n = 0; hit = 0; next }
              { buf[++n] = $0; if ($0 == "      \"event\": \"" ev "\"," || $0 == "      \"event\": \"" ev "\"") hit = 1 }
            '
          }
          has_event() {
            [ -n "$(entry "$1")" ]
          }
          # field 이벤트 칸 [부모 칸]: 스칼라 값 하나(문자열은 따옴표를 걷는다)
          field() {
            entry "$1" | awk -v key="$2" -v parent="${3:-}" '
              BEGIN { top = "      \"" key "\": "; sub8 = "        \"" key "\": " }
              parent != "" && $0 == "      \"" parent "\": {" { inside = 1; next }
              inside && /^      \},?$/ { inside = 0; next }
              !found && ((parent == "" && index($0, top) == 1) || (parent != "" && inside && index($0, sub8) == 1)) {
                v = substr($0, length(parent == "" ? top : sub8) + 1)
                sub(/,$/, "", v)
                if (v !~ /^[[{]/) { gsub(/^"|"$/, "", v); print v; found = 1 }
              }
            '
          }
          # children 이벤트 부모: 「칸 값 · 칸 값」 한 줄
          children() {
            entry "$1" | awk -v parent="$2" '
              $0 == "      \"" parent "\": {" { inside = 1; next }
              inside && /^      \},?$/ { inside = 0; next }
              inside {
                line = $0; sub(/^ +"/, "", line); split(line, kv, "\": ")
                v = kv[2]; sub(/,$/, "", v); gsub(/^"|"$/, "", v)
                out = out (out == "" ? "" : " · ") kv[1] " " v
              }
              END { print out }
            '
          }
          # list 이벤트 칸: 문자열 배열 원소를 한 줄에 하나
          list() {
            entry "$1" | awk -v key="$2" '
              $0 == "      \"" key "\": [" { inside = 1; next }
              inside && /^      \],?$/ { inside = 0; next }
              inside { v = $0; sub(/^ +/, "", v); sub(/,$/, "", v); gsub(/^"|"$/, "", v); print v }
            '
          }

          say "### 전환 — 환경 $INPUT_ENV · $INPUT_MODE"

          # 실행 이름으로 로그를 좁힌다(account.yml과 같은 이유 — 직전 실행의 줄을 이번 결과로 보이지 않게).
          # 실패하면 --format 값이 안 잡히므로 최근 실행에서 이름을 얻되, 실행 전과 같은 이름이면 새 실행이 없는 것이다.
          PREV="$(gcloud run jobs executions list --job "$JOB" --region "$REGION" --project "$PROJECT" --limit 1 --format='value(metadata.name)' 2>/dev/null || true)"
          EXEC_OK=1
          EXEC=""
          if [ "$INPUT_MODE" = "apply" ]; then
            ARGS="--apply,--confirm,$CONFIRM,--run-url,$RUN_URL"
            EXEC="$(gcloud run jobs execute "$JOB" --region "$REGION" --project "$PROJECT" --args="$ARGS" --wait --format='value(metadata.name)')" || EXEC_OK=0
          else
            EXEC="$(gcloud run jobs execute "$JOB" --region "$REGION" --project "$PROJECT" --wait --format='value(metadata.name)')" || EXEC_OK=0
          fi
          if [ "$EXEC_OK" = 0 ] || [ -z "$EXEC" ]; then
            EXEC="$(gcloud run jobs executions list --job "$JOB" --region "$REGION" --project "$PROJECT" --limit 1 --format='value(metadata.name)' 2>/dev/null || true)"
            if [ -z "$EXEC" ] || [ "$EXEC" = "$PREV" ]; then
              say "**실행 실패** — Job 실행이 생기지 않음(전환 안 됨) · 위 gcloud 오류부터 볼 것 (job_name=$JOB)"
              exit 1
            fi
          fi

          FILTER="resource.type=\"cloud_run_job\" AND resource.labels.job_name=\"$JOB\" AND labels.\"run.googleapis.com/execution_name\"=\"$EXEC\""

          # 실패 · 거부 갈래: CLI 종료 1의 console.error 사유(textPayload)와 백업 조회 불가 사유를 한 번 읽는다(B3).
          read_reasons() {
            local text backup
            text="$(gcloud logging read "$FILTER" --project "$PROJECT" --freshness=30m --limit=30 --format='value(textPayload)' || true)"
            text="$(printf '%s\n' "$text" | sed '/^[[:space:]]*$/d' | tr '\n' ' ' | sed 's/ *$//')"
            backup="$(gcloud logging read "$FILTER AND jsonPayload.event=\"status.backup_unavailable\"" --project "$PROJECT" --freshness=30m --limit=1 --format='value(jsonPayload.reason)' || true)"
            if [ -n "$text" ]; then
              say "사유: $text"
            fi
            if [ -n "$backup" ]; then
              say "사유: 백업 조회 불가(status.backup_unavailable) $backup"
            fi
          }

          # 끝 기록: 실행 성공 · dry-run = cutover.done / 실행 성공 · apply = cutover.objects 또는 objects 0인 cutover.done
          # (08-02는 키가 있을 때만 pending · objects를 찍는다) / 실행 실패 = cutover.refused 또는 cutover.objects.
          is_end() {
            if [ "$EXEC_OK" = 1 ]; then
              if [ "$INPUT_MODE" != "apply" ]; then
                has_event cutover.done
                return
              fi
              has_event cutover.objects && return 0
              has_event cutover.done && [ "$(field cutover.done objects)" = "0" ]
              return
            fi
            has_event cutover.refused || has_event cutover.objects
          }

          # Cloud Logging은 수집이 늦다 — 첫 일치 줄에서 멈추지 않고, 매 회 이 실행의 cutover 줄 전부를 다시 읽어
          # 끝 기록이 보일 때만 멈춘다. severity 조건은 걸지 않는다(account.yml과 같은 이유).
          LOGS=""
          poll_logs() {
            local i
            for i in $(seq 1 "$ATTEMPTS"); do
              LOGS="$(gcloud logging read "$FILTER AND jsonPayload.event=~\"^cutover[.]\"" --project "$PROJECT" --freshness=30m --limit=30 --format='json(jsonPayload)' || true)"
              if is_end; then
                return 0
              fi
              if [ "$i" -lt "$ATTEMPTS" ]; then
                sleep "$INTERVAL"
              fi
            done
            return 1
          }
          poll_logs || true

          if has_event cutover.refused; then
            REASON="$(field cutover.refused reason)"
            case "$REASON" in
              already_cut_over)
                NEXT="이미 전환됨 · 다시 돌리지 않음"
                ;;
              confirm_mismatch)
                NEXT="dry-run 뒤 입력이 생김 · CUTOVER §3 5번 dry-run부터 다시"
                ;;
              backup_not_fresh)
                if [ "$(field cutover.refused kind backup)" = "unavailable" ]; then
                  NEXT="백업 조회 불가 · 백업을 다시 뜨지 말고 Job 환경 · 권한 확인"
                else
                  NEXT="백업이 3시간 넘음 · §3 4번 수동 백업부터 다시"
                fi
                NEXT="$NEXT (backup: $(children cutover.refused backup))"
                ;;
              *)
                NEXT="모르는 사유 · apply를 다시 돌리지 말고 Logging에서 job_name=$JOB · execution=$EXEC 확인"
                ;;
            esac
            say "**거부 · $REASON** — $NEXT"
            read_reasons
            exit 1
          fi

          if ! has_event cutover.done; then
            if [ "$EXEC_OK" = 0 ]; then
              say "**실행 실패** — apply를 다시 돌리지 말고 같은 워크플로 dry-run으로 전환 여부부터 볼 것 · Logging에서 job_name=$JOB · execution=$EXEC"
              read_reasons
            else
              say "**요약 없음 — apply를 다시 돌리지 말고 같은 워크플로 dry-run으로 전환 여부부터 볼 것 · Logging에서 job_name=$JOB · execution=$EXEC**"
            fi
            exit 1
          fi

          MARKER="$(field cutover.done marker)"
          if [ "$INPUT_MODE" = "apply" ]; then
            say "**전환 표시 $MARKER (서울 $(seoul "$MARKER"))** · 총건수 $(field cutover.done total) · 카운터 초기화 $(field cutover.done counters)행 · 지울 객체 $(field cutover.done objects)개"
          elif [ -n "$MARKER" ]; then
            say "**전환됨 $MARKER (서울 $(seoul "$MARKER")) · demo 남은 행 $(field cutover.done demoRemaining)**"
          else
            say "총건수 $(field cutover.done total) · 카운터 초기화 $(field cutover.done counters)행 · 지울 객체 $(field cutover.done objects)개"
            say "남는 업무성 표(kept · 정보 — 확인 문자열 밖): $(children cutover.done kept)"
            say "**다음 apply의 confirm: $(field cutover.done token)**"
          fi
          # 표별 건수는 cutover.done 로그 그대로(칸 이름 marker · demoRemaining을 바꾸지 않는다 — 08-07 · 08-08이 grep한다).
          { echo '```json'; entry cutover.done; echo '```'; echo; } | tee -a "$GITHUB_STEP_SUMMARY"

          if [ "$INPUT_MODE" = "apply" ]; then
            if has_event cutover.objects; then
              STOPPED="$(field cutover.objects stopped)"
              say "객체 정리: 전체 $(field cutover.objects total) · 지움 $(field cutover.objects deleted) · 고아 $(field cutover.objects orphaned) · 멈춤 ${STOPPED/null/없음}"
              ORPHANS="$(list cutover.objects orphanKeys)"
              if [ -n "$ORPHANS" ]; then
                say "고아 객체(손으로 지울 키 — CUTOVER §3 7번 장부에 적을 것):"
                { printf '%s\n' "$ORPHANS" | sed 's/^/- /'; echo; } | tee -a "$GITHUB_STEP_SUMMARY"
              fi
            elif [ "$(field cutover.done objects)" != "0" ]; then
              if [ "$EXEC_OK" = 0 ]; then
                say "**객체 정리 중 끊김 — 전환은 커밋됨 · 남은 키 = pending 키 전부** · apply를 다시 돌리지 말 것"
                { list cutover.objects.pending keys | sed 's/^/- /'; echo; } | tee -a "$GITHUB_STEP_SUMMARY"
                read_reasons
                exit 1
              fi
              say "**정리 결과 로그 늦음 — 실행 성공 · 전환 커밋됨 · 정리는 끝났다 · apply를 다시 돌리지 말고 Logging에서 job_name=$JOB · execution=$EXEC의 cutover.objects(고아 목록)를 볼 것**"
              echo "::warning::정리 결과 로그 늦음 — 전환 완료 · apply 다시 돌리지 말 것"
              exit 0
            fi
          fi

          if [ "$EXEC_OK" = 0 ]; then
            say "**실행 실패** — apply를 다시 돌리지 말고 같은 워크플로 dry-run으로 전환 여부부터 볼 것 · Logging에서 job_name=$JOB · execution=$EXEC"
            read_reasons
            exit 1
          fi
