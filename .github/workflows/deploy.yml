name: deploy

# main push는 스테이징에 자동 배포한다. 프로덕션은 workflow_dispatch로만 실행되고
# (push로는 절대 실행되지 않는다, D-05) 가드 스텝이 스테이징이 실제로 서빙 중인
# 이미지 태그를 확인한 뒤에만 같은 SHA를 그대로 승격한다 — GitHub Environments·
# required reviewers는 쓰지 않는다(무료 플랜 비공개 저장소). 변수는 저장소 수준
# vars.*이고 시크릿 탭은 비워 둔다(WIF, 키 파일 없음).
# 스테이징·프로덕션 잡은 main ref에서만 돈다 — 다른 브랜치의 workflow_dispatch는
# ref-guard 스텝에서 인증 전에 실패한다(ENG-D12 · 머지 묶음 규칙, 04-50).
on:
  push:
    branches: [main]
    # ci.yml과 동일한 재포함 목록을 유지한다(WR-09) — 두 워크플로가 어긋나면
    # docs 전용 커밋이 CI는 돌지만 배포는 스킵되거나 그 반대가 된다.
    paths:
      - "**"
      - "!.planning/**"
      - "!docs/**"
      - "docs/design/tokens.css"
      - "docs/design/SYSTEM.md"
      - "docs/design/DECISIONS.md"
      - "docs/ARCHITECTURE.md"
      - "docs/OPERATIONS.md"
      - "docs/RESTORE.md"
  workflow_dispatch:
    inputs:
      target:
        type: choice
        description: "배포 대상"
        options:
          - staging
          - production
        default: staging
      sha:
        type: string
        description: "production 전용 — 배포할 git SHA(7~40자 hex); 비우면 스테이징이 현재 서빙 중인 SHA"
        default: ""

concurrency:
  group: deploy
  cancel-in-progress: false

permissions:
  contents: read
  id-token: write

jobs:
  # 배포 CI 중복 제거(2026-10-01 사용자 결정): main 커밋 tree가 PR CI 전체 통과 기록(ci.yml
  # tested-tree 아티팩트)과 같으면 같은 내용을 이미 검사한 것이라 ci를 건너뛴다. 한 번에 하나씩,
  # 차례 PR이 main을 반영한 뒤 CI를 돌고 머지하면 squash 커밋 tree가 그 기록과 같다. 기록이
  # 없거나(사이에 다른 머지 · draft · .claude만) 조회가 실패하면 hit가 비어 ci 전체가 돈다.
  # 다른 저장소(포크) PR이 올린 같은 이름 아티팩트는 세지 않는다.
  tested:
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    permissions:
      actions: read
      contents: read
    outputs:
      hit: ${{ steps.find.outputs.hit }}
    steps:
      - uses: actions/checkout@v4
      - id: find
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
        run: |
          tree=$(git rev-parse 'HEAD^{tree}')
          n=$(gh api "repos/$REPO/actions/artifacts?name=tested-tree-$tree" \
            --jq '[.artifacts[] | select(.expired == false and .workflow_run.head_repository_id == .workflow_run.repository_id)] | length' || echo 0)
          if [ "$n" -gt 0 ]; then
            echo "hit=true" >> "$GITHUB_OUTPUT"
            echo "tree $tree: PR CI 전체 통과 기록 있음 — ci 건너뜀" >> "$GITHUB_STEP_SUMMARY"
          else
            echo "tree $tree: 기록 없음 — ci 전체 실행" >> "$GITHUB_STEP_SUMMARY"
          fi

  ci:
    needs: tested
    if: >-
      !cancelled() &&
      ((github.event_name == 'push' && needs.tested.outputs.hit != 'true') ||
      (github.event_name == 'workflow_dispatch' && inputs.target == 'staging'))
    uses: ./.github/workflows/ci.yml

  staging:
    needs: [tested, ci]
    if: >-
      !cancelled() &&
      (github.event_name == 'push' || (github.event_name == 'workflow_dispatch' && inputs.target == 'staging')) &&
      (needs.ci.result == 'success' || (needs.ci.result == 'skipped' && needs.tested.outputs.hit == 'true'))
    runs-on: ubuntu-latest
    env:
      ALERT_EMAIL: ${{ vars.ALERT_EMAIL }}
    steps:
      - id: ref-guard
        shell: bash
        env:
          REF: ${{ github.ref }}
        run: |
          if [ "$REF" != "refs/heads/main" ]; then
            echo "::error::main이 아닌 ref는 배포하지 않습니다(ENG-D12) — main에서 다시 실행하세요" >&2
            exit 1
          fi
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - id: auth
        uses: google-github-actions/auth@v3
        with:
          workload_identity_provider: projects/${{ vars.GCP_PROJECT_NUMBER }}/locations/global/workloadIdentityPools/github/providers/erp-repo
          service_account: gha-deployer@${{ vars.GCP_PROJECT_ID }}.iam.gserviceaccount.com
      - uses: google-github-actions/setup-gcloud@v3
        with:
          install_components: alpha,beta
      - id: deploy
        shell: bash
        run: |
          bash scripts/deploy.sh --env staging --project "${{ vars.GCP_PROJECT_ID }}" --region "${{ vars.GCP_REGION }}" --sha "${{ github.sha }}" | tee deploy.log
          URL=$(grep '^SERVICE_URL=' deploy.log | cut -d= -f2-)
          echo "url=$URL" >> "$GITHUB_OUTPUT"
          echo "staging: $URL (sha ${{ github.sha }})" >> "$GITHUB_STEP_SUMMARY"

  production:
    if: github.event_name == 'workflow_dispatch' && inputs.target == 'production'
    runs-on: ubuntu-latest
    env:
      ALERT_EMAIL: ${{ vars.ALERT_EMAIL }}
    steps:
      - id: ref-guard
        shell: bash
        env:
          REF: ${{ github.ref }}
        run: |
          if [ "$REF" != "refs/heads/main" ]; then
            echo "::error::main이 아닌 ref는 배포하지 않습니다(ENG-D12) — main에서 다시 실행하세요" >&2
            exit 1
          fi
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - id: auth
        uses: google-github-actions/auth@v3
        with:
          workload_identity_provider: projects/${{ vars.GCP_PROJECT_NUMBER }}/locations/global/workloadIdentityPools/github/providers/erp-repo
          service_account: gha-deployer@${{ vars.GCP_PROJECT_ID }}.iam.gserviceaccount.com
      - uses: google-github-actions/setup-gcloud@v3
        with:
          install_components: alpha,beta
      # 스테이징이 실제로 서빙 중인 SHA만 프로덕션에 올린다(D-05) — 이 가드가
      # 통과하지 못하면(exit 1) 다음 배포 스텝은 실행되지 않는다(if: success() 기본).
      # 판정 로직은 scripts/promote-guard.sh에 있다(단위 테스트가 fakebin gcloud로
      # 검증한다 — test/unit/deploy/promote-guard-sh.test.ts).
      - id: guard
        shell: bash
        env:
          SHA_INPUT: ${{ inputs.sha }}
          PROJECT: ${{ vars.GCP_PROJECT_ID }}
          REGION: ${{ vars.GCP_REGION }}
        run: |
          GUARD_OUT="$(bash scripts/promote-guard.sh --project "$PROJECT" --region "$REGION" --sha "$SHA_INPUT")"
          printf '%s\n' "$GUARD_OUT"
          SHA=$(printf '%s\n' "$GUARD_OUT" | grep '^PROMOTE_SHA=' | cut -d= -f2-)
          STAGING_SHA=$(printf '%s\n' "$GUARD_OUT" | grep '^STAGING_SHA=' | cut -d= -f2-)
          echo "sha=$SHA" >> "$GITHUB_OUTPUT"
          echo "promoting $SHA (staging serving $STAGING_SHA)" >> "$GITHUB_STEP_SUMMARY"
      - id: deploy
        shell: bash
        run: |
          bash scripts/deploy.sh --env prod --project "${{ vars.GCP_PROJECT_ID }}" --region "${{ vars.GCP_REGION }}" --sha "${{ steps.guard.outputs.sha }}" | tee deploy.log
          URL=$(grep '^SERVICE_URL=' deploy.log | cut -d= -f2-)
          echo "url=$URL" >> "$GITHUB_OUTPUT"
          echo "production: $URL (sha ${{ steps.guard.outputs.sha }})" >> "$GITHUB_STEP_SUMMARY"
