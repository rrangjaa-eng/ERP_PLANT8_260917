name: guard-probe

# 임시 워크플로 — 01-08 Task 1 전에 scripts/promote-guard.sh를 **읽기 전용으로**
# 실제 GCP 스테이징에 대고 한 번 돌려본다. 배포는 하지 않는다.
# 실행자 세션은 아웃바운드 방화벽 때문에 Actions 로그 저장소에 닿지 못하므로
# (api.github.com만 통과) 결과를 orphan 브랜치에 커밋해 contents API로 회수한다.
# 검증이 끝나면 이 파일과 결과 브랜치는 삭제한다.

on:
  workflow_dispatch:

concurrency:
  group: guard-probe
  cancel-in-progress: false

permissions:
  contents: write
  id-token: write

jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - id: auth
        uses: google-github-actions/auth@v3
        with:
          workload_identity_provider: projects/${{ vars.GCP_PROJECT_NUMBER }}/locations/global/workloadIdentityPools/github/providers/erp-repo
          service_account: gha-deployer@${{ vars.GCP_PROJECT_ID }}.iam.gserviceaccount.com
      - uses: google-github-actions/setup-gcloud@v3
        with:
          install_components: alpha,beta

      - name: probe
        shell: bash
        env:
          PROJECT: ${{ vars.GCP_PROJECT_ID }}
          PROJECT_NUMBER: ${{ vars.GCP_PROJECT_NUMBER }}
          REGION: ${{ vars.GCP_REGION }}
        run: |
          set +e
          OUT=/tmp/probe.txt
          : >"$OUT"

          echo "## 1. 스테이징 서빙 리비전" >>"$OUT"
          SVC_JSON=$(gcloud run services describe plant8-staging --region "$REGION" --project "$PROJECT" --format=json)
          REV=$(printf '%s' "$SVC_JSON" | jq -r '.status.traffic[]? | select(.percent == 100) | .revisionName' | head -n1)
          echo "revision=$REV" >>"$OUT"
          echo "traffic entries=$(printf '%s' "$SVC_JSON" | jq '.status.traffic | length')" >>"$OUT"
          echo "status.url=$(printf '%s' "$SVC_JSON" | jq -r '.status.url')" >>"$OUT"

          echo "" >>"$OUT"
          echo "## 2. 그 리비전의 image / env (가드가 읽는 자리)" >>"$OUT"
          REV_JSON=$(gcloud run revisions describe "$REV" --region "$REGION" --project "$PROJECT" --format=json)
          echo "image=$(printf '%s' "$REV_JSON" | jq -r '.spec.containers[0].image')" >>"$OUT"
          echo "env names=$(printf '%s' "$REV_JSON" | jq -c '[.spec.containers[0].env[]? | .name]')" >>"$OUT"
          echo "APP_GIT_SHA=$(printf '%s' "$REV_JSON" | jq -r '.spec.containers[0].env[]? | select(.name=="APP_GIT_SHA") | .value')" >>"$OUT"
          echo "APP_ENV=$(printf '%s' "$REV_JSON" | jq -r '.spec.containers[0].env[]? | select(.name=="APP_ENV") | .value')" >>"$OUT"

          echo "" >>"$OUT"
          echo "## 3. promote-guard.sh — sha 비움 (스테이징 서빙 SHA 채택)" >>"$OUT"
          bash scripts/promote-guard.sh --project "$PROJECT" --region "$REGION" --sha "" >>"$OUT" 2>&1
          echo "exit=$?" >>"$OUT"

          echo "" >>"$OUT"
          echo "## 4. promote-guard.sh — sha 명시 (5ca35226…)" >>"$OUT"
          bash scripts/promote-guard.sh --project "$PROJECT" --region "$REGION" --sha "5ca35226bc2f75be453e8c02adbe7aeb929bc1d7" >>"$OUT" 2>&1
          echo "exit=$?" >>"$OUT"

          echo "" >>"$OUT"
          echo "## 5. promote-guard.sh — 일부러 틀린 sha (거부돼야 정상)" >>"$OUT"
          bash scripts/promote-guard.sh --project "$PROJECT" --region "$REGION" --sha "0000000000000000000000000000000000000000" >>"$OUT" 2>&1
          echo "exit=$?" >>"$OUT"

          echo "" >>"$OUT"
          echo "## 6. 프로덕션 서비스가 이미 있는지 (없으면 첫 배포)" >>"$OUT"
          gcloud run services describe plant8-prod --region "$REGION" --project "$PROJECT" --format='value(status.url)' >>"$OUT" 2>&1
          echo "exit=$?" >>"$OUT"

          # 마스킹: 프로젝트 ID와 12자리 프로젝트 번호를 지운다(D-03).
          sed -i "s/${PROJECT}/<PROJECT_ID>/g; s/${PROJECT_NUMBER}/<PROJECT_NUMBER>/g; s/[0-9]\{12\}/<PROJECT_NUMBER>/g" "$OUT"
          cat "$OUT"

      - name: publish result
        if: always()
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          git config user.email "actions@github.com"
          git config user.name "github-actions"
          git checkout --orphan guard-probe-result
          git rm -rq --cached . || true
          rm -rf ./* .github .planning 2>/dev/null || true
          cp /tmp/probe.txt ./RESULT.md
          git add RESULT.md
          git commit -q -m "guard probe result"
          git push -f origin guard-probe-result
