name: probe

# 임시 워크플로 — 01-07 Task 3의 실측을 GitHub Actions 안에서 한다. 실행자
# 세션은 아웃바운드 방화벽 때문에 Cloud Run URL에도, Actions 로그 저장소에도
# 닿지 못한다(api.github.com만 통과). 그래서 결과를 orphan 브랜치
# probe-result에 커밋해 API로 읽는다. 측정이 끝나면 파일과 브랜치를 지운다.
#
# mode=account-diag: account.yml 실패 원인을 Cloud Logging에서 가져온다.
# 임시 비밀번호가 결과 파일에 절대 들어가지 않도록 password/비밀번호가 든
# 줄은 푸시 전에 [REDACTED]로 치환한다.
on:
  workflow_dispatch:
    inputs:
      mode:
        type: choice
        description: "측정 모드"
        options:
          - account-diag
        default: account-diag

permissions:
  contents: write
  id-token: write

jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - id: auth
        uses: google-github-actions/auth@v3
        with:
          workload_identity_provider: projects/${{ vars.GCP_PROJECT_NUMBER }}/locations/global/workloadIdentityPools/github/providers/erp-repo
          service_account: gha-deployer@${{ vars.GCP_PROJECT_ID }}.iam.gserviceaccount.com
      - uses: google-github-actions/setup-gcloud@v3
        with:
          install_components: alpha,beta
      - shell: bash
        env:
          PROJECT: ${{ vars.GCP_PROJECT_ID }}
          REGION: ${{ vars.GCP_REGION }}
        run: |
          set -u
          source infra/names.sh
          JOB="$(job_name staging account)"
          OUT=/tmp/probe-result.txt
          : > "$OUT"
          say() { printf '%s\n' "$*" >> "$OUT"; }

          say "## account job executions (recent)"
          gcloud run jobs executions list --job "$JOB" --region "$REGION" --project "$PROJECT" \
            --limit 5 --format='table(metadata.name, status.startTime, status.completionTime, status.succeededCount, status.failedCount, status.cancelledCount)' >> "$OUT" 2>&1 || true
          say ""

          LAST="$(gcloud run jobs executions list --job "$JOB" --region "$REGION" --project "$PROJECT" --limit 1 --format='value(metadata.name)' 2>/dev/null || true)"
          say "latest execution: $LAST"
          say ""

          say "## latest execution conditions"
          gcloud run jobs executions describe "$LAST" --region "$REGION" --project "$PROJECT" \
            --format='yaml(status.conditions)' >> "$OUT" 2>&1 || true
          say ""

          say "## account job logs — severity>=ERROR (1h)"
          gcloud logging read \
            "resource.type=\"cloud_run_job\" AND resource.labels.job_name=\"$JOB\" AND severity>=ERROR" \
            --project "$PROJECT" --freshness=1h --limit=30 \
            --format='value(timestamp, textPayload, jsonPayload.message)' >> "$OUT" 2>&1 || true
          say ""

          say "## account job logs — all payloads for latest execution (1h)"
          gcloud logging read \
            "resource.type=\"cloud_run_job\" AND resource.labels.job_name=\"$JOB\" AND labels.\"run.googleapis.com/execution_name\"=\"$LAST\"" \
            --project "$PROJECT" --freshness=1h --limit=60 \
            --format='value(timestamp, severity, textPayload, jsonPayload.message, jsonPayload.event)' >> "$OUT" 2>&1 || true
          say ""

          # --- 안전장치: 임시 비밀번호가 담긴 줄은 리포에 절대 남기지 않는다
          sed -i -E 's/.*([Pp]assword|비밀번호).*/[REDACTED — password line withheld; read it in the Actions log]/g' "$OUT"
          # --- 마스킹: 프로젝트 번호(12자리)·프로젝트 ID
          sed -i -E "s/[0-9]{12}/<PROJECT_NUMBER>/g; s/${PROJECT}/<PROJECT_ID>/g" "$OUT"

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git checkout --orphan probe-result2
          git rm -rf . > /dev/null 2>&1 || true
          cp "$OUT" ./probe-result.txt
          git add probe-result.txt
          git commit -m "chore: account diag result (temporary, delete after reading)"
          git push -f origin probe-result2
