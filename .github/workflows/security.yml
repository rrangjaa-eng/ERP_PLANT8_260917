name: security

# 보안 스캐너 5종(#109 · 사용자 결정 2026-09-30 선택 A — 로컬 Docker 대신 CI).
#   gitleaks    저장소 이력 전체 속 비밀
#   semgrep     정적 규칙(레지스트리 p/default · 지표 전송 끔)
#   zizmor      워크플로 보안
#   osv-scanner 의존성 취약점(pnpm-lock.yaml)
#   trivy       설정 · IaC(Dockerfile 등)
# 도구는 서드파티 Action 없이 버전을 고정해 설치한다 — Go 모듈은 sum.golang.org가
# 체크섬을 확인하고, PyPI 도구는 정확한 버전으로 받는다. 비밀 · 쓰기 권한은 쓰지 않는다.
# 막는 기준은 높음 이상(사용자 카드 2026-11-16): 그보다 낮은 것은 로그에만 남는다.
# main 전체는 workflow_dispatch로 돌린다.
on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
  workflow_dispatch: {}

concurrency:
  group: security-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  GITLEAKS_VERSION: v8.30.1
  SEMGREP_VERSION: 1.185.0
  ZIZMOR_VERSION: 1.32.0
  OSV_SCANNER_VERSION: v2.7.1
  TRIVY_VERSION: v0.76.2

jobs:
  gitleaks:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-go@d35c59abb061a4a6fb18e82ac0862c26744d6ab5 # v5.5.0
        with:
          go-version: stable
          cache: false
      - run: go install "github.com/zricethezav/gitleaks/v8@${GITLEAKS_VERSION}"
      - run: |
          "$(go env GOPATH)/bin/gitleaks" git --redact --no-banner --exit-code 1 .

  semgrep:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - run: pipx run "semgrep==${SEMGREP_VERSION}" scan --config p/default --metrics off --severity ERROR --error .

  zizmor:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      # 온라인 감사(가짜 커밋 · 알려진 취약 Action)에 읽기 토큰만 쓴다.
      - run: pipx run "zizmor==${ZIZMOR_VERSION}" --no-progress --min-severity high .github/workflows
        env:
          GH_TOKEN: ${{ github.token }}

  osv-scanner:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - uses: actions/setup-go@d35c59abb061a4a6fb18e82ac0862c26744d6ab5 # v5.5.0
        with:
          go-version: stable
          cache: false
      - run: go install "github.com/google/osv-scanner/v2/cmd/osv-scanner@${OSV_SCANNER_VERSION}"
      # 종료 1 = 취약점 있음(아래에서 심각도로 거른다) · 그 밖의 0 아닌 값 = 도구 오류.
      - run: |
          rc=0
          "$(go env GOPATH)/bin/osv-scanner" scan source --lockfile pnpm-lock.yaml \
            --format json --output osv.json || rc=$?
          if [ "$rc" -gt 1 ]; then exit "$rc"; fi
          jq -r '.results[]?.packages[]? | .package as $p | .groups[]?
            | "\(.max_severity // "?")\t\($p.name)@\($p.version)\t\(.ids | join(","))"' osv.json | sort -rn
          # 심각도를 못 읽은 묶음(칸 이름이 바뀐 때 포함)도 막는다 — 조용히 통과하지 않게.
          high="$(jq '[.results[]?.packages[]?.groups[]? | (.max_severity // "" | tonumber? // 99) | select(. >= 7)] | length' osv.json)"
          echo "CVSS 7.0 이상 또는 심각도 없음: ${high}건"
          test "$high" -eq 0

  trivy:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - uses: actions/setup-go@d35c59abb061a4a6fb18e82ac0862c26744d6ab5 # v5.5.0
        with:
          go-version: stable
          cache: false
      - run: go install "github.com/aquasecurity/trivy/cmd/trivy@${TRIVY_VERSION}"
      - run: |
          "$(go env GOPATH)/bin/trivy" config --exit-code 1 --severity HIGH,CRITICAL .
